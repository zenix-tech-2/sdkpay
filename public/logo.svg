<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="sGrad" x1="150" y1="10" x2="110" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28B4F2"/>
      <stop offset="0.42" stop-color="#2067E8"/>
      <stop offset="1" stop-color="#7A2BE2"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28B4F2" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#28B4F2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D7BF0"/>
    </linearGradient>
    <linearGradient id="payGrad" x1="520" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F9CF0"/>
      <stop offset="0.5" stop-color="#2E6BEB"/>
      <stop offset="1" stop-color="#8A2BE0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="70" y1="150" x2="220" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131B45"/>
      <stop offset="1" stop-color="#232B63"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D365"/>
      <stop offset="0.5" stop-color="#E7A93C"/>
      <stop offset="1" stop-color="#B97E1E"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="420" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A2BE0"/>
      <stop offset="0.5" stop-color="#3D63EC"/>
      <stop offset="1" stop-color="#28B4F2"/>
    </linearGradient>
  </defs>

  <!-- icon -->
  <g transform="translate(10 8) scale(0.98)">
    <rect x="4"  y="88"  width="96" height="11" rx="5.5" fill="url(#lineGrad)"/>
    <rect x="22" y="112" width="78" height="11" rx="5.5" fill="url(#lineGrad)"/>
    <rect x="40" y="136" width="60" height="11" rx="5.5" fill="url(#lineGrad)"/>
    <path d="M268 26 C190 10 92 34 92 76 C92 112 178 108 236 122 C286 134 300 176 268 200 C238 223 132 226 96 196"
          stroke="url(#sGrad)" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M54 232 L96 158 C100 150 110 150 116 156 L128 168 C134 174 132 186 122 190 L84 232 Z" fill="#141B45"/>
    <g transform="translate(112 148) rotate(-12)">
      <rect width="132" height="78" rx="14" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
      <rect x="14" y="30" width="34" height="24" rx="5" fill="url(#chipGrad)"/>
      <path d="M14 42 H48 M31 30 V54" stroke="#7A5310" stroke-opacity="0.55" stroke-width="2.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="368" y="122" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="96" letter-spacing="-2">
    <tspan fill="#0E1A38">SDK </tspan><tspan fill="url(#payGrad)">Pay</tspan><tspan fill="#0E1A38" font-size="22" dy="-58">™</tspan>
  </text>

  <!-- tagline -->
  <text x="368" y="172" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="21" letter-spacing="6" fill="#33415C">Integrate<tspan fill="#2067E8" dx="14">•</tspan><tspan dx="14">Pay</tspan><tspan fill="#8A2BE0" dx="14">•</tspan><tspan dx="14">Grow</tspan></text>

  <!-- swoosh underline -->
  <path d="M368 196 C 520 178, 700 176, 880 192 C 700 186, 520 190, 368 214 Z" fill="url(#swooshGrad)"/>
</svg>
